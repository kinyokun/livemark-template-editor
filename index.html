<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livemark 模版工坊</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="brand">LIVEMARK<small>模版工坊</small></div>
  <div class="grow"></div>
  <button class="btn" id="btnImport">导入</button>
  <button class="btn" id="btnSave">存入模版库</button>
  <button class="btn" id="btnExportFile">导出模版</button>
  <button class="btn primary" id="btnExportPNG">导出图片</button>
  <div class="tip">导出的 .livemark 用隔空投送发到手机，点开即在 Livemark 里打开。</div>
  <input type="file" id="fileImport" accept=".livemark,.lmtemplate,.encoretemplate,.json,application/json" hidden>
</header>

<div class="shell">
  <aside class="library" id="library"></aside>

  <section class="stage">
    <div class="stage-bar">
      <div class="menu-wrap">
        <button class="btn small" id="btnLayerMenu">图层 · <span id="layerName">画布与底图</span> ▾</button>
      </div>
      <div class="menu-wrap">
        <button class="btn small primary" id="btnAddElement">添加元素 ＋</button>
      </div>
      <div class="grow"></div>
      <span class="hint" id="canvasNote"></span>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <div class="board" id="board">
        <canvas id="canvas"></canvas>
        <canvas id="overlay" class="overlay"></canvas>
      </div>
    </div>
    <div class="stage-foot">
      <span>点选图层 · 拖图片调露出哪一段 · 拖普通图层换位 · ⌘滚轮缩放</span>
      <span>Delete 删除 · 方向键换位 · ⌘D 复制 · ⌘Z 撤销 · Esc 回到画布</span>
      <span id="sizeNote"></span>
    </div>
  </section>

  <aside class="inspector" id="inspector"></aside>
</div>

<div class="toast" id="toast"></div>
<div class="drop-veil" id="dropVeil">松手导入 .livemark</div>

<input type="file" id="filePickImage" accept="image/*" hidden>
<input type="file" id="filePickVideo" accept="video/quicktime,video/mp4,.mov,.mp4" hidden>

<!-- core.js 是 App 的 TypeScript 原样编译过来的：模型、排版引擎、文件编码、九个内置风格。
     render.js 注入「量文字」与「画」，其余三个是工坊自己的界面。 -->
<script src="covers.js"></script>
<script src="core.js"></script>
<script src="render.js"></script>
<script src="sample.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
