<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Livemark · 模板制作器</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="bar"><a class="brand" href="#">LIVEMARK<span>模板制作器</span></a><input id="documentName" aria-label="模板名称" maxlength="40"><span class="saved" id="saveState" aria-live="polite">草稿自动保存</span><div class="grow"></div><button id="btnImport">导入</button><button id="btnSave">保存模板</button><button class="primary" id="btnExportFile">导出模板</button></header>
<main class="workspace"><aside class="library"><div class="tabs"><button id="tabTemplates" aria-pressed="true">模板</button><button id="tabLayers" aria-pressed="false">图层</button></div><div id="sidebar"></div></aside>
<section class="studio" aria-label="画布编辑器"><nav class="tools"><button id="undo" title="撤销 ⌘Z" aria-label="撤销">↶</button><button id="redo" title="重做 ⇧⌘Z" aria-label="重做">↷</button><span class="divider"></span><button id="addRegion">＋ 内容模块</button><button id="addText">文字</button><button id="addField">记录词条</button><button id="addImage">图片</button><button id="addShape">形状</button><button id="addLive">Live Photo</button><button id="addInk">手写内容</button><button id="finishGrid" class="primary" hidden>完成模块编辑</button></nav>
<div id="viewport" class="viewport"><div id="board" class="board"><canvas id="canvas" aria-label="模板排版预览"></canvas><canvas id="overlay" aria-label="拖动元素或控制点以编辑模板" tabindex="0"></canvas></div></div>
<footer class="stagefoot"><span id="selectionHint">点选元素，拖动改位置</span><div class="grow"></div><button id="zoomOut" aria-label="缩小">−</button><button id="zoomFit" title="适应画布">100%</button><button id="zoomIn" aria-label="放大">＋</button></footer><div id="overflow" role="status" hidden></div></section>
<aside id="inspector" class="inspector" aria-label="所选元素属性"></aside></main>
<dialog id="picker"><header><h2 id="pickerTitle"></h2><button id="closePicker" aria-label="关闭">关闭</button></header><div id="pickerBody"></div></dialog><div id="toast" role="status"></div>
<input type="file" id="fileImport" accept=".livemark,.json,.lmtemplate" hidden><input type="file" id="fileFont" accept=".ttf,.otf" hidden>
<script src="core.js"></script><script src="render.js"></script><script src="sample.js"></script><script src="ui.js"></script><script src="app.js"></script></body></html>
